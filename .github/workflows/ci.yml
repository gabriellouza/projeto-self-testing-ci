name: Wallet API - CI
on:
  push:
    branches: [main, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check src tests
      - name: Tests and coverage
        run: python -m pytest --cov=src --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml
      - name: Coverage gates (lines >= 85%, branches >= 80%)
        run: python scripts/check_coverage.py coverage.xml
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-ci-reports
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn
